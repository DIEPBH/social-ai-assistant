services:
  web:
    build: .
    container_name: social_ai_web
    restart: always
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - ./env/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: social_ai_celery_worker
    command: celery -A config worker -l info
    restart: always
    volumes:
      - media_volume:/app/media
    env_file:
      - ./env/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    container_name: social_ai_celery_beat
    command: celery -A config beat -l info
    restart: always
    env_file:
      - ./env/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started

  db:
    image: postgres:15
    container_name: social_ai_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-social_ai_db}
      POSTGRES_USER: ${POSTGRES_USER:-social_ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./env/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-social_ai_user} -d $${POSTGRES_DB:-social_ai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: social_ai_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: social_ai_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
